name: Publish Changed Version

on:
  push:
    branches:
      - sesl-androidx-main
    paths:
      - 'manifest.gradle.kts'
  workflow_dispatch:
    inputs:
      bootstrap_all:
        description: 'Publish all SESL modules in dependency order for an empty GitHub Packages repo'
        required: false
        default: false
        type: boolean
jobs:
  check-and-publish:
    env:
      GH_USERNAME: ${{ secrets.GH_USERNAME }}
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
      ORDERED_MODULES: "androidx.core androidx.core-ktx androidx.customview androidx.viewpager androidx.fragment androidx.drawerlayout androidx.coordinatorlayout androidx.appcompat androidx.recyclerview androidx.preference androidx.viewpager2 androidx.swiperefreshlayout androidx.slidingpanelayout androidx.indexscroll androidx.picker-basic androidx.picker-color androidx.picker-app androidx.apppickerview"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Detect changed modules
        id: detect_changed_modules
        run: |
          if [ "${{ github.event.inputs.bootstrap_all || 'false' }}" = "true" ]; then
            echo "changed_modules=$ORDERED_MODULES" >> "$GITHUB_OUTPUT"
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Bootstrap mode enabled; publishing all SESL modules in dependency order"
            exit 0
          fi

          PREV_COMMIT=$(git rev-parse HEAD^)

          extract_versions() {
            # $1 = file content
            echo "$1" | grep '^[[:space:]]*"androidx\.' | \
              sed -E 's/^[[:space:]]*"([^"]+)"[[:space:]]+to[[:space:]]+listOf\("([^"]+)",[[:space:]]*"([^"]+)",[[:space:]]*"([^"]+)",.*/\1|\2|\3|\4/'
          }

          OLD_CONTENT=$(git show "$PREV_COMMIT:manifest.gradle.kts" 2>/dev/null || echo "")
          NEW_CONTENT=$(cat manifest.gradle.kts)

          OLD_VERSIONS=$(extract_versions "$OLD_CONTENT")
          NEW_VERSIONS=$(extract_versions "$NEW_CONTENT")

          CHANGED_MODULES=""

          while IFS='|' read -r MODULE OLD_VER1 OLD_VER2 OLD_VER3; do
            NEW_LINE=$(echo "$NEW_VERSIONS" | grep "^$MODULE|")
            NEW_VER1=$(echo "$NEW_LINE" | cut -d'|' -f2)
            NEW_VER2=$(echo "$NEW_LINE" | cut -d'|' -f3)
            NEW_VER3=$(echo "$NEW_LINE" | cut -d'|' -f4)
            if { [ "$OLD_VER1" != "$NEW_VER1" ] || [ "$OLD_VER2" != "$NEW_VER2" ] || [ "$OLD_VER3" != "$NEW_VER3" ]; } && [ -n "$NEW_LINE" ]; then
              CHANGED_MODULES="$CHANGED_MODULES $MODULE"
              echo "::notice::Detected version change in $MODULE: old=[$OLD_VER1,$OLD_VER2,$OLD_VER3], new=[$NEW_VER1,$NEW_VER2,$NEW_VER3]"
            fi
          done <<< "$OLD_VERSIONS"

          CHANGED_MODULES=$(echo $CHANGED_MODULES | xargs) # trim
          echo "changed_modules=$CHANGED_MODULES" >> $GITHUB_OUTPUT
          if [ -n "$CHANGED_MODULES" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync SESL versions from manifest
        if: steps.detect_changed_modules.outputs.any_changed == 'true'
        run: |
          python3 <<'PY'
          import pathlib
          import re

          manifest_text = pathlib.Path("manifest.gradle.kts").read_text()
          catalog_path = pathlib.Path("gradle/libs.versions.toml")
          catalog_text = catalog_path.read_text()

          manifest_versions = []
          for module, base, sesl, rev in re.findall(
              r'"(androidx\.[^"]+)"\s+to\s+listOf\("([^"]+)",\s*"([^"]+)",\s*"([^"]+)",',
              manifest_text,
          ):
              artifact = module.removeprefix("androidx.")
              group_suffix = artifact.split("-")[0]
              coordinate = f'sesl.androidx.{group_suffix}:{artifact}'
              version = f'{base}+{sesl}+{rev}'
              manifest_versions.append((coordinate, version))

          for coordinate, version in manifest_versions:
              pattern = re.compile(
                  rf'^(sesl-androidx-[A-Za-z0-9-]+\s*=\s*\{{\s*module\s*=\s*"{re.escape(coordinate)}",\s*version\s*=\s*")([^"]+)("\s*\}})$',
                  re.MULTILINE,
              )
              catalog_text, count = pattern.subn(rf'\g<1>{version}\g<3>', catalog_text)
              if count:
                  print(f'Updated {coordinate} -> {version}')

          catalog_path.write_text(catalog_text)
          PY

      - name: Seed local Maven repo
        if: steps.detect_changed_modules.outputs.any_changed == 'true'
        run: |
          for module in $ORDERED_MODULES; do
            if [[ " ${{ steps.detect_changed_modules.outputs.changed_modules }} " == *" $module "* ]]; then
              gradle_project=${module#androidx.}
              echo "Seeding $gradle_project to mavenLocal..."
              ./gradlew -PskipDocs=true :$gradle_project:publishToMavenLocal
            fi
          done

      - name: Publish changed modules
        if: steps.detect_changed_modules.outputs.any_changed == 'true'
        run: |
          for module in $ORDERED_MODULES; do
            if [[ " ${{ steps.detect_changed_modules.outputs.changed_modules }} " == *" $module "* ]]; then
              gradle_project=${module#androidx.}
              echo "Publishing $gradle_project..."
              ./gradlew -PskipDocs=true :$gradle_project:publish
            fi
          done

      - name: Generate and publish Dokka docs
        if: steps.detect_changed_modules.outputs.any_changed == 'true'
        run: |
          ./gradlew dokkaGenerate

      - name: Publish to GitHub Pages
        if: steps.detect_changed_modules.outputs.any_changed == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          BRANCH: gh-pages
          FOLDER: build/dokka/html
